services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: SpaceTelemetry
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh -e 'describe keyspaces' 127.0.0.1 9042 >/dev/null 2>&1"
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./database/cassandra/init.cql:/init.cql:ro
    command:
      [
        "cqlsh",
        "cassandra",
        "9042",
        "-f",
        "/init.cql"
      ]

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/space-telemetry-dev
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:7474 >/dev/null 2>&1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ingestion:
    build:
      context: ./services/ingestion
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

  alert:
    build:
      context: ./services/alert
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

volumes:
  mongo-data:
  cassandra-data:
  neo4j-data:
  neo4j-logs: